<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZJOB by LENIX - Skilled Trades & Technical Talent Matcher</title>
    <link rel="icon" type="image/png" href="/assets/lenix-logo-light.png">
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!--
      Tailwind is compiled at build time via postcss.config.js +
      tailwind.config.js (see index.css for @tailwind directives) — no CDN
      script here. The Tailwind CDN build (`cdn.tailwindcss.com`) is a
      runtime JIT compiler explicitly documented as unsuitable for
      production (no purging, large payload); the AI-Studio-scaffolded
      version of this app shipped it anyway. All npm packages (React,
      react-router-dom, Supabase, etc.) are resolved from node_modules by
      Vite's bundler, so no browser import map is needed either.
    -->
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-surface font-sans text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
